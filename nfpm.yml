name: gnusteampacker
arch: amd64
version: "0.1.0"
release: 1
section: utils
priority: optional
maintainer: SavageCore <talk@savagecore.uk>
description: |
  GnuSteamPacker - Linux-native Steam game downloader and packager.
  Downloads Steam games via SteamCMD, strips sensitive data from ACF files,
  and produces compressed archives with release text for distribution.
vendor: GnuSteamPacker Project
homepage: https://github.com/SavageCore/GnuSteamPacker
license: GPL-3.0-or-later

depends:
  - python3 (>= 3.11)
  - python3-gi
  - python3-gi-cairo
  - gir1.2-gtk-4.0
  - gir1.2-adw-1
  - p7zip-full

contents:
  - src: ./dist/gnusteampacker
    dst: /usr/lib/python3/dist-packages/gnusteampacker
    type: dir

  - src: ./data/org.gnusteampacker.GnuSteamPacker.desktop
    dst: /usr/share/applications/org.gnusteampacker.GnuSteamPacker.desktop

  - src: ./data/icons/hicolor/scalable/apps/org.gnusteampacker.GnuSteamPacker.svg
    dst: /usr/share/icons/hicolor/scalable/apps/org.gnusteampacker.GnuSteamPacker.svg

  - src: ./scripts/gnusteampacker-launcher.sh
    dst: /usr/bin/gnusteampacker
    file_info:
      mode: 0755

overrides:
  rpm:
    depends:
      - python3 >= 3.11
      - python3-gobject
      - gtk4
      - libadwaita
      - p7zip
