name: gnusteampacker-gui
arch: amd64
version: "0.1.0"
release: 1
section: utils
priority: optional
maintainer: SavageCore <talk@savagecore.uk>
description: |
  GnuSteamPacker - GTK4/libadwaita graphical interface.
  Provides the desktop GUI for GnuSteamPacker. Depends on gnusteampacker (CLI).
vendor: GnuSteamPacker Project
homepage: https://github.com/SavageCore/GnuSteamPacker
license: GPL-3.0-or-later

depends:
  - gnusteampacker
  - python3-gi
  - python3-gi-cairo
  - gir1.2-gtk-4.0
  - gir1.2-adw-1

contents:
  - src: ./dist-gui/usr/lib/python${PYVER}/site-packages/gnusteampacker/async_runner.py
    dst: /usr/lib/python${PYVER}/site-packages/gnusteampacker/async_runner.py

  - src: ./dist-gui/usr/lib/python${PYVER}/site-packages/gnusteampacker/ui
    dst: /usr/lib/python${PYVER}/site-packages/gnusteampacker/ui
    type: dir

  - src: ./data/org.gnusteampacker.GnuSteamPacker.desktop
    dst: /usr/share/applications/org.gnusteampacker.GnuSteamPacker.desktop

  - src: ./data/icons/hicolor/scalable/apps/org.gnusteampacker.GnuSteamPacker.svg
    dst: /usr/share/icons/hicolor/scalable/apps/org.gnusteampacker.GnuSteamPacker.svg

overrides:
  rpm:
    depends:
      - gnusteampacker
      - python3-gobject
      - gtk4
      - libadwaita
