name: gnusteampacker-full
arch: amd64
version: "0.1.0"
release: 1
section: utils
priority: optional
maintainer: SavageCore <talk@savagecore.uk>
description: |
  GnuSteamPacker - CLI and GTK4/libadwaita graphical interface.
  Downloads Steam games via SteamCMD, strips sensitive data from ACF files,
  and produces compressed archives with release text for distribution.
vendor: GnuSteamPacker Project
homepage: https://github.com/SavageCore/GnuSteamPacker
license: GPL-3.0-or-later

depends:
  - python3 (>= 3.11)
  - p7zip-full
  - python3-rich
  - python3-aiohttp
  - python3-vdf
  - python3-secretstorage
  - python3-requests-toolbelt
  - python3-gi
  - python3-gi-cairo
  - gir1.2-gtk-4.0
  - gir1.2-adw-1

contents:
  - src: ./dist-gui/usr
    dst: /usr
    type: tree

  - src: ./scripts/gnusteampacker-launcher.sh
    dst: /usr/bin/gnusteampacker
    file_info:
      mode: 0755

overrides:
  rpm:
    depends:
      - python3 >= 3.11
      - p7zip
      - python3-rich
      - python3-aiohttp
      - python3-vdf
      - python3-secretstorage
      - python3-requests-toolbelt
      - python3-gobject
      - gtk4
      - libadwaita
