name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -fsSL https://github.com/orhun/git-cliff/releases/download/v2.7.0/git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv git-cliff-*/git-cliff /usr/local/bin/

      - name: Generate release notes
        id: cliff
        run: echo "content<<EOF" >> $GITHUB_OUTPUT && git cliff --latest --strip all >> $GITHUB_OUTPUT && echo "EOF" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.cliff.outputs.content }}

  packages:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-adw-1 p7zip-full gettext
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update && sudo apt-get install -y nfpm

      - name: Compile translations
        run: make mo

      - name: Prepare package directory
        run: |
          uv sync
          mkdir -p dist
          cp -r gnusteampacker dist/

      - name: Build DEB and RPM
        run: make deb && make rpm

      - name: Build AppImage
        run: |
          pip install python-appimage
          make appimage

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.deb
            *.rpm
            *.AppImage

  flatpak:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gettext
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Compile translations
        run: make mo

      - name: Import Flatpak GPG key
        run: |
          if [ -z "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY secret is not set"
            exit 1
          fi
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | base64 -d | gpg --import

      - name: Build Flatpak
        run: |
          FLATPAK_GPG_KEY=$(gpg --list-keys --keyid-format=long --with-colons | awk -F: '/^fpr/{print $10; exit}')
          flatpak-builder --force-clean --user --install-deps-from=flathub \
            --gpg-sign=$FLATPAK_GPG_KEY \
            --repo=flatpak-repo build-dir org.gnusteampacker.GnuSteamPacker.json
          flatpak build-bundle \
            --gpg-sign=$FLATPAK_GPG_KEY \
            --gpg-keys=gnusteampacker-flatpak.gpg \
            flatpak-repo gnusteampacker.flatpak org.gnusteampacker.GnuSteamPacker
          cp gnusteampacker-flatpak.gpg flatpak-repo/
          touch flatpak-repo/.nojekyll

      - uses: softprops/action-gh-release@v3
        with:
          files: gnusteampacker.flatpak

      - name: Deploy OSTree repo to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: flatpak-repo
          clean: true
